# Claude light review — one comment per push to a pull request (James, 2026-10-24,
# Developer_Documents/designer_notes_2026_10_24_pr_automation.md). Comment only: it never
# pushes, merges or closes. The scheduled sweep does those (.claude/skills/review-prs/SKILL.md,
# "Automated mode"). Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN, made with
# `claude setup-token`; each run spends James's Claude plan allowance.
name: claude-pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Pull requests from forks get no secrets; skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Empty until James adds the secret; the steps below then skip instead of failing.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Light review of PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow .claude/skills/review-prs/SKILL.md, "Automated mode", LIGHT REVIEW: judge
            base + this PR against the product-safety checklist and post one comment with the
            verdict, reasons and the smallest next action. Edit your earlier comment on this PR
            instead of adding another. Do not push, merge, close or resolve anything.
          claude_args: --model claude-opus-5-5 --max-turns 30
